[workspace]
members = [".", "crates/coaptic-plugtest"]
default-members = ["."]
resolver = "2"

[package]
name = "coaptic"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Jeff Glousher"]
license = "MIT OR Apache-2.0"
description = "Stand-alone no_std CoAP engine"
repository = "https://github.com/jeffglousher/coaptic"
homepage = "https://github.com/jeffglousher/coaptic"
# docs.rs after crates.io 0.1.0 (#132). Until then, rustdoc is `cargo doc --open`.
documentation = "https://github.com/jeffglousher/coaptic"
readme = "README.md"
categories = ["no-std", "embedded", "network-programming"]
keywords = ["coap", "no-std", "embedded", "no-alloc"]
# Library crate only. Workspace harness, RFC copies, and agent/CI files stay out.
# Cargo.lock is auto-included (example binary); it is not listed here.
include = [
    "src/**",
    "examples/**",
    "tests/**",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "README.md",
    "SECURITY.md",
    "CONTRIBUTING.md",
    "rust-toolchain.toml",
]

[features]
default = []
alloc = []
std = ["alloc"]
# Pairwise OSCORE (RFC 8613). AES-CCM-16-64-128 + HKDF-SHA-256 via RustCrypto.
# Default stays zero-dep. Engine does not own keys — see `oscore`.
oscore = ["dep:aes", "dep:ccm", "dep:hkdf", "dep:sha2"]

[dependencies]
aes = { version = "0.8.4", default-features = false, optional = true }
ccm = { version = "0.5.0", default-features = false, optional = true }
hkdf = { version = "0.13.0", default-features = false, optional = true }
sha2 = { version = "0.10.8", default-features = false, optional = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "coap_server"
required-features = ["std"]
