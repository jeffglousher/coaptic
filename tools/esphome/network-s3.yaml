esphome:
  name: coaptic-network-s3

esp32:
  board: seeed_xiao_esp32s3
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf
    version: 5.5.5
  toolchain: esp-idf

logger:
  hardware_uart: UART0
  baud_rate: 0
  level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s

external_components:
  - source:
      type: git
      url: https://github.com/jeffglousher/coaptic
      ref: t3code/esphome-import
      path: tools/esphome/components
    components: [coaptic_network]

coaptic_network:
  qualification_only: true
  rust_runtime: bundled
  run_id: "0123456789abcdef0123456789abcdef"
