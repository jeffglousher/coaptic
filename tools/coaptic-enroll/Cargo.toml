[package]
name = "coaptic-enroll"
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
publish = false
license = "MIT OR Apache-2.0"
description = "Local hardware-approved commissioning for Coaptic devices"

# Host integration is separate from the allocator-free library and its MSRV.
[workspace]

[features]
default = ["development-piv"]
webauthn = ["dep:webauthn-rs", "dep:webauthn-authenticator-rs", "dep:openssl"]
webauthn-tests = ["webauthn", "webauthn-authenticator-rs/softpasskey"]
# Explicit hardware-development profile. It never weakens the FIDO2 verifier.
development-piv = ["dep:yubikey", "dep:x509-cert", "dep:p256", "dep:p384", "dep:rsa", "dep:sha2"]

[dependencies]
coaptic-console-core = { path = "../coaptic-console-core" }
coaptic = { path = "../..", default-features = false, features = ["std", "edhoc"] }
# Read verified public UV/backup flags and the initial counter after registration.
# Unchecked credentials are never constructed by the production path.
webauthn-rs = { version = "=0.5.5", optional = true, default-features = false, features = ["danger-credential-internals"] }
openssl = { version = "0.10", optional = true, features = ["vendored"] }
webauthn-authenticator-rs = { version = "=0.5.5", optional = true, default-features = false }
aes-gcm = { version = "=0.10.3", features = ["zeroize"] }
p256 = { version = "=0.13.2", optional = true, features = ["ecdsa", "pem"] }
p384 = { version = "=0.13.1", optional = true, features = ["ecdsa"] }
rsa = { version = "=0.9.10", optional = true }
sha2 = { version = "=0.10.9", optional = true, features = ["oid"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
ciborium = "0.2"
getrandom = { version = "=0.3.4", features = ["std"] }
blake3 = "=1.8.7"
zeroize = "1"
serialport = { version = "=4.8.1", default-features = false }
yubikey = { version = "=0.8.0", optional = true, features = ["untested"] }
x509-cert = { version = "=0.2.5", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Rust D-Bus transport; keyring retains its blocking API and existing item attributes.
keyring = { version = "=3.6.3", default-features = false, features = ["async-secret-service", "async-io", "crypto-rust"] }

[target.'cfg(windows)'.dependencies]
webauthn-authenticator-rs = { version = "=0.5.5", optional = true, default-features = false, features = ["win10"] }
windows = { version = "=0.41.0", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_Threading"] }

[dev-dependencies]
keyring = { version = "=3.6.3", default-features = false }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
