# Pre-release PR checks are advisory; broad qualification is opt-in.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_validation:
        description: Run the full feature, packaging and companion matrix
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quick:
    name: Quick development checks
    if: github.event_name == 'pull_request' || !inputs.full_validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features --lib
      - run: cargo test --locked --no-default-features --lib

  msrv:
    name: library MSRV
    if: github.event_name == 'workflow_dispatch' && inputs.full_validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.89.0
      - run: cargo check --locked -p coaptic --no-default-features
      - run: cargo check --locked -p coaptic --all-features

  fmt:
    name: fmt
    if: github.event_name == 'workflow_dispatch' && inputs.full_validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    if: github.event_name == 'workflow_dispatch' && inputs.full_validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo clippy --all-targets --no-default-features -- -D warnings

  test:
    name: test
    if: github.event_name == 'workflow_dispatch' && inputs.full_validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --no-default-features
      - run: cargo test --all-features
      - run: cargo test --no-default-features --features alloc
      - run: cargo test --no-default-features --features oscore
      - run: cargo test --no-default-features --features alloc,oscore
      - run: cargo test --no-default-features --features std
      - run: cargo test --features std --test std_fixed_storage
      - run: cargo check --locked --example fixed_service
      - run: cargo test --locked --example fixed_service
      - name: Run the README client and server
        shell: bash
        run: |
          cargo build --locked --example server --example client --features std
          target/debug/examples/server &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          target/debug/examples/client
      - run: cargo run --locked --example oscore_pair --features std
      - run: cargo test --locked --example oscore_pair --features std
      - run: cargo run --locked --example oscore_pair --features std,alloc -- --alloc
      - run: cargo test --locked --example oscore_pair --features std,alloc

  doc:
    name: doc
    if: github.event_name == 'workflow_dispatch' && inputs.full_validation
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: --cfg docsrs -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo doc --no-deps --no-default-features
      - run: cargo doc --no-deps --all-features

  # Check package contents without publication; this version may already exist.
  package:
    name: package
    if: github.event_name == 'workflow_dispatch' && inputs.full_validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Published crate stays lean
        run: |
          set -euo pipefail
          cargo package -p coaptic --list --locked
          if cargo package -p coaptic --list --locked | grep -E '^(knowledge/|crates/|tools/|\.github/|\.agents/)' ; then
            echo "::error::published crate must not include knowledge/, crates/, tools/, .github/, or .agents/"
            exit 1
          fi
      - run: cargo package --workspace --locked

  validation:
    name: Companion validation
    if: github.event_name == 'workflow_dispatch' && inputs.full_validation
    uses: jeffglousher/coaptic-validation/.github/workflows/validation.yml@7e6107c03d41f9624beb4241b26f31ff06e762de
    with:
      suite_revision: 7e6107c03d41f9624beb4241b26f31ff06e762de
      library_repository: ${{ github.repository }}
      library_revision: ${{ github.sha }}
