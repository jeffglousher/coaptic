name: Enrollment provider

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/coaptic-enroll/**'
      - 'tools/coaptic-console-core/**'
      - 'tools/coaptic-async-host/**'
      - 'src/provisioning/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/enrollment.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enrollment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: enrollment host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: tools/coaptic-enroll
    env:
      RUSTUP_TOOLCHAIN: '1.89.0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      LC_ALL: C
      LANG: C
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.89.0'
          components: rustfmt, clippy
          targets: thumbv6m-none-eabi
      - name: Install Linux native adapter dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev pkg-config gnome-keyring dbus-x11
      - name: Select native Windows Perl for vendored OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidates = @('C:\Strawberry\perl\bin\perl.exe') + @((Get-Command perl -All -ErrorAction SilentlyContinue).Source)
          $nativePerl = $null
          foreach ($candidate in ($candidates | Select-Object -Unique)) {
            if ($candidate -and (Test-Path -LiteralPath $candidate) -and ((& $candidate -e 'print $^O') -eq 'MSWin32')) {
              $nativePerl = $candidate
              break
            }
          }
          if (-not $nativePerl) { throw 'Native Windows Perl unavailable' }
          "OPENSSL_SRC_PERL=$nativePerl" >> $env:GITHUB_ENV
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --manifest-path ../coaptic-console-core/Cargo.toml --target thumbv6m-none-eabi
      - run: cargo test --locked --manifest-path ../coaptic-console-core/Cargo.toml
      - run: cargo test --locked --manifest-path ../coaptic-async-host/Cargo.toml
      - run: cargo check --no-default-features --locked
      - run: cargo test --all-targets --locked
      - name: Default CLI excludes bundled native crypto and D-Bus clients
        shell: pwsh
        run: |
          $tree = cargo tree --locked --edges normal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($tree -match '\b(openssl|openssl-sys|native-tls|libdbus-sys|dbus) v') {
            throw 'Default commissioning dependency tree contains a native crypto/TLS or D-Bus client'
          }
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-targets --all-features --locked
      - name: Verify Linux Secret Service custody
        if: runner.os == 'Linux'
        env:
          COAPTIC_NATIVE_CUSTODY_TEST: '1'
        run: |
          dbus-run-session -- bash <<'SCRIPT'
            set -euo pipefail
            XDG_DATA_HOME=$(mktemp -d)
            export XDG_DATA_HOME
            trap 'rm -rf "$XDG_DATA_HOME"' EXIT
            printf "coaptic-ci-only\n" | gnome-keyring-daemon --unlock --components=secrets
            cargo test --all-features --locked native_custody_roundtrip_and_missing_key_refusal -- --ignored
          SCRIPT
      - name: Verify macOS Keychain custody
        if: runner.os == 'macOS'
        env:
          COAPTIC_NATIVE_CUSTODY_TEST: '1'
        run: |
          keychain="$RUNNER_TEMP/coaptic-custody.keychain-db"
          previous=$(security default-keychain -d user | tr -d '"' | xargs)
          keychains=()
          while IFS= read -r item; do keychains+=("$(echo "$item" | xargs)"); done < <(security list-keychains -d user)
          trap 'security default-keychain -d user -s "$previous"; security list-keychains -d user -s "${keychains[@]}"; security delete-keychain "$keychain"' EXIT
          security create-keychain -p coaptic-ci-only "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          security unlock-keychain -p coaptic-ci-only "$keychain"
          cargo test --all-features --locked native_custody_roundtrip_and_missing_key_refusal -- --ignored
      - run: cargo build --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coaptic-enroll-${{ matrix.os }}
          path: |
            tools/coaptic-enroll/target/debug/coaptic-enroll
            tools/coaptic-enroll/target/debug/coaptic-enroll.exe
          if-no-files-found: error
          retention-days: 7
