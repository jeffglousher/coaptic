# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      oscore-crypto:
        patterns:
          - aes
          - ccm
          - hkdf
          - sha2
      dtls-interop:
        patterns:
          - coap
          - webrtc-dtls
          - webrtc-util
          - rustls
    # coap 0.28.1 exposes DTLS 0.8 / util 0.8 / rustls 0.21 types.
    # Those versions remain in the legacy peer; peer-coaptic is independently
    # on DTLS 0.12 / util 0.11. Qualify future majors with the process matrix (#191).
    ignore:
      # aes 0.9.3 raises MSRV above the library Rust 1.85 contract.
      - dependency-name: aes
        versions: ["0.9.3"]
      - dependency-name: webrtc-dtls
        update-types: [version-update:semver-major]
      - dependency-name: webrtc-util
        update-types: [version-update:semver-major]
      - dependency-name: rustls
        update-types: [version-update:semver-major]
