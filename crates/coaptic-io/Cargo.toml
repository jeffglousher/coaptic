[package]
name = "coaptic-io"
version = "0.0.10"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "Compile-time shared sync and async protocol bodies for coaptic"

repository = "https://github.com/jeffglousher/coaptic"
homepage = "https://github.com/jeffglousher/coaptic"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "visit-mut", "extra-traits"] }
