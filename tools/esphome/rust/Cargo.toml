[package]
name = "coaptic-esphome-probe"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["staticlib"]

[features]
default = []
oscore = ["qualification-no-std/oscore"]

[dependencies]
qualification-no-std = { path = "../../../crates/qualification-no-std" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
