name: Enrollment provider

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/coaptic-enroll/**'
      - 'tools/coaptic-console-core/**'
      - 'src/provisioning/**'
      - '.github/workflows/enrollment.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enrollment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: enrollment host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: tools/coaptic-enroll
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      LC_ALL: C
      LANG: C
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.89.0'
          components: rustfmt, clippy
          targets: thumbv6m-none-eabi
      - name: Install Linux native adapter dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev libdbus-1-dev pkg-config
      - name: Select native Windows Perl for vendored OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidates = @('C:\Strawberry\perl\bin\perl.exe') + @((Get-Command perl -All -ErrorAction SilentlyContinue).Source)
          $nativePerl = $null
          foreach ($candidate in ($candidates | Select-Object -Unique)) {
            if ($candidate -and (Test-Path -LiteralPath $candidate) -and ((& $candidate -e 'print $^O') -eq 'MSWin32')) {
              $nativePerl = $candidate
              break
            }
          }
          if (-not $nativePerl) { throw 'Native Windows Perl unavailable' }
          "OPENSSL_SRC_PERL=$nativePerl" >> $env:GITHUB_ENV
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --manifest-path ../coaptic-console-core/Cargo.toml --target thumbv6m-none-eabi
      - run: cargo test --locked --manifest-path ../coaptic-console-core/Cargo.toml
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-targets --all-features --locked
      - run: cargo build --all-features --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coaptic-enroll-${{ matrix.os }}
          path: |
            tools/coaptic-enroll/target/debug/coaptic-enroll
            tools/coaptic-enroll/target/debug/coaptic-enroll.exe
          if-no-files-found: error
          retention-days: 7
