name: Commissioning tools

on:
  pull_request:
    paths:
      - 'tools/coaptic-enroll/**'
      - 'tools/coaptic-console-core/**'
      - '.github/workflows/commissioning.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commissioning-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.99.0'
          targets: thumbv6m-none-eabi
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev libdbus-1-dev pkg-config
      - run: cargo check --locked --manifest-path tools/coaptic-console-core/Cargo.toml --target thumbv6m-none-eabi
      - run: cargo test --locked --manifest-path tools/coaptic-console-core/Cargo.toml
      - run: cargo test --locked --manifest-path tools/coaptic-enroll/Cargo.toml --features development-piv --lib --bin coaptic-enroll
      - run: cargo build --locked --manifest-path tools/coaptic-enroll/Cargo.toml --features development-piv --bin coaptic-enroll
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coaptic-enroll-${{ matrix.os }}
          path: |
            tools/coaptic-enroll/target/debug/coaptic-enroll
            tools/coaptic-enroll/target/debug/coaptic-enroll.exe
          if-no-files-found: error
          retention-days: 7
